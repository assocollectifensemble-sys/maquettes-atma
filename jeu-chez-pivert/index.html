<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="robots" content="noindex,nofollow">
<title>Chez Pivert · le jeu (version test)</title>
<meta name="theme-color" content="#123a44">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chez Pivert">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Pacifico:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{--nuit:#0e2329;--acc:#caaa6d;--acc2:#e7cf98;--fond:#f5eee2;--chaud:#e3743c;--onacc:#0e2329;--onchaud:#fff;--ok:#1f9d63;--txt:#15262b;--doux:#5d6f73;
--titre:'Cormorant Garamond',Georgia,serif;--k1:#e5484d;--k2:#2f7fe0;--k3:#e39b0b;--k4:#1f9d55;--r:22px;--pop:cubic-bezier(.2,1.6,.4,1);--sh:0 10px 26px #0e23291c}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{font-family:Nunito,ui-rounded,"SF Pro Rounded",system-ui,sans-serif;font-weight:600;background:#0b1518;color:var(--txt);display:flex;justify-content:center;align-items:center;gap:48px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
#app{position:relative;width:100%;max-width:460px;height:100vh;height:100dvh;display:grid;grid-template-rows:auto 1fr auto;background:var(--fond);overflow:hidden}
#app.full{display:block}#app.full main{position:absolute;inset:0}#app.full .hd,#app.full .nav{display:none}
/* ---- en-tête ---- */
.hd{display:flex;align-items:center;gap:7px;padding:calc(env(safe-area-inset-top) + 7px) 10px 7px 12px;background:var(--nuit);color:#fff;min-height:50px;position:relative;z-index:6}
.hd .lg{height:26px;max-width:104px;object-fit:contain}
.hd .nm{font-family:var(--titre);font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.hd .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:900;white-space:nowrap;line-height:1}
.pill.test{background:#ffffff1a;color:var(--acc2);font-size:10px;letter-spacing:.08em;padding:6px 8px}
.pill.inst{background:var(--acc);color:var(--onacc);box-shadow:0 3px 0 #0005}
.pill.xp{background:#ffffff14;color:#fff;border:1.5px solid #ffffff2a}
.pill.xp b{color:#ffd45c;font-variant-numeric:tabular-nums}
.pill.xp.bump{animation:bump .5s var(--pop)}@keyframes bump{40%{transform:scale(1.25)}}
/* ---- barre du bas : 4 onglets numérotés ---- */
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:7px 8px calc(env(safe-area-inset-bottom) + 7px);background:#fff;box-shadow:0 -8px 24px #0e232914;position:relative;z-index:5}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px 6px;border-radius:16px;font-size:11px;font-weight:800;color:var(--doux);line-height:1.1;transition:background .2s,transform .2s var(--pop)}
.nav button .ic{font-size:21px;line-height:1.15;filter:saturate(.6);transition:.2s}
.nav button .r{display:flex;align-items:center;gap:3px}.nav button .n{flex:none;width:20px;height:20px;border-radius:50%;background:#e7e2d8;color:var(--nuit);font-size:11px;font-weight:900;display:grid;place-items:center;border:2px solid #fff}
.nav button.on{background:var(--nuit);color:#fff;transform:translateY(-3px);box-shadow:0 5px 0 color-mix(in srgb,var(--nuit) 65%,#000)}
.nav button.on .ic{filter:none;transform:scale(1.1)}
.nav button.on .n{background:var(--acc);color:var(--onacc);border-color:var(--nuit)}
.nav button.next::after{content:"à voir";position:absolute;top:-10px;right:0;background:var(--chaud);color:var(--onchaud);font-size:9.5px;font-weight:900;padding:2px 7px;border-radius:999px;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
/* ---- écrans ---- */
main{position:relative;overflow:hidden}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateX(22px)}}
.scr.back{animation:inb .3s ease}@keyframes inb{from{opacity:0;transform:translateX(-22px)}}
.dark{background:var(--nuit);color:#fff}
.pad{padding:14px 16px}
.col{display:flex;flex-direction:column}
.grow{flex:1;min-height:0}
.k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:900;color:var(--acc)}
.t1{font-family:var(--titre);font-weight:600;font-size:clamp(30px,8.8vw,40px);line-height:1.04}
.t1 i{color:var(--acc2);font-style:italic}
.t2{font-family:var(--titre);font-weight:600;font-size:clamp(25px,7vw,30px);line-height:1.08}
.t3{font-weight:900;font-size:16.5px;line-height:1.25}
.p{font-size:14.5px;line-height:1.45}
.m{font-size:12.5px;line-height:1.4;color:var(--doux)}
.dark .m{color:#ffffffb0}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;padding:10px 16px;border-radius:18px;background:var(--nuit);color:#fff;font-weight:900;font-size:16px;text-align:center;text-decoration:none;line-height:1.15;box-shadow:0 5px 0 color-mix(in srgb,var(--nuit) 60%,#000);transition:transform .1s,box-shadow .1s;overflow:hidden}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--nuit) 60%,#000)}
.btn.a{background:var(--acc);color:var(--onacc);box-shadow:0 5px 0 color-mix(in srgb,var(--acc) 58%,#000)}
.btn.a:active{box-shadow:0 1px 0 color-mix(in srgb,var(--acc) 58%,#000)}
.btn.c{background:var(--chaud);color:var(--onchaud);box-shadow:0 5px 0 color-mix(in srgb,var(--chaud) 58%,#000)}
.btn.w{background:#fff;color:var(--nuit);box-shadow:0 5px 0 #0003}
.btn.g{background:transparent;border:2px solid currentColor;color:inherit;box-shadow:none;min-height:44px;font-size:14px}
.btn.s{min-height:44px;font-size:14px;border-radius:14px}
.btn.shine::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,#fff0,#ffffff70,#fff0);animation:shine 2.8s ease-in-out infinite}
@keyframes shine{0%,55%{left:-60%}100%{left:130%}}
.btn+.btn{margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;background:#ffffff22;font-size:12px;font-weight:800;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.row{display:flex;gap:8px;align-items:center}
.card{background:#fff;border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.toast{position:absolute;left:50%;bottom:86px;transform:translate(-50%,30px);opacity:0;background:var(--nuit);color:#fff;padding:11px 16px;border-radius:999px;font-size:13px;font-weight:800;z-index:80;transition:.3s;width:max-content;max-width:90%;text-align:center;pointer-events:none;box-shadow:0 8px 20px #0004}
.toast.on{transform:translate(-50%,0);opacity:1}
.nextbar{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 14px;border-radius:18px;background:var(--chaud);color:var(--onchaud);font-weight:900;font-size:14px;text-align:left;width:100%;box-shadow:0 4px 0 color-mix(in srgb,var(--chaud) 58%,#000)}
.nextbar b{font-size:20px}.nextbar span{flex:1}
.fx{position:absolute;z-index:75;font-weight:900;font-size:20px;color:#ffd45c;text-shadow:0 2px 8px #0008;pointer-events:none;animation:fx 1.1s ease-out forwards}
@keyframes fx{0%{transform:translateY(0) scale(.6);opacity:0}20%{transform:translateY(-10px) scale(1.15);opacity:1}100%{transform:translateY(-70px) scale(1);opacity:0}}
.confetti{position:absolute;inset:0;z-index:74;pointer-events:none}
/* ---- accueil ---- */
.hero{position:relative;flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:9px;padding:16px;color:#fff;background:var(--nuit) center/cover}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 0%,#0000 18%,color-mix(in srgb,var(--nuit) 70%,#0000) 48%,var(--nuit) 74%)}
.hero>*{position:relative}
.hero .top{position:absolute;top:12px;left:14px;right:14px;display:flex;align-items:center;gap:8px}
.lang{display:flex;background:#0006;border-radius:999px;padding:3px;margin-left:auto;backdrop-filter:blur(6px)}
.lang button{padding:5px 10px;font-size:11px;font-weight:900;border-radius:999px;color:#fffc}
.lang button.on{background:#fff;color:var(--nuit)}
.route{display:flex;align-items:center;gap:0;margin:2px 0}
.route .md{width:42px;height:42px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:20px;background:#ffffff1c;border:2px solid #ffffff55;position:relative}
.route .md.d{background:var(--acc);border-color:var(--acc)}
.route .md.q{width:22px;height:22px;font-size:11px;font-weight:900;background:#fff2;border-width:1.5px}
.route .ln{flex:1;height:3px;min-width:4px;background:repeating-linear-gradient(90deg,#fff8 0 5px,#0000 5px 9px)}
.route .md.g{background:var(--chaud);border-color:#fff;box-shadow:0 0 0 4px #ffffff22;animation:pulse 1.8s infinite}
.from{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:16px;background:#ffffff17;border:1px solid #ffffff30;text-align:left;width:100%;color:#fff;backdrop-filter:blur(6px)}
.from b{font-size:22px}.from div{flex:1;font-size:12px;line-height:1.3}.from strong{display:block;font-size:14px}
.bonbanner{display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:18px;background:var(--acc);color:var(--onacc);font-weight:900;font-size:15px;width:100%;text-align:left;box-shadow:0 5px 0 color-mix(in srgb,var(--acc) 58%,#000)}
/* qui joue */
.crewscr{background:radial-gradient(120% 60% at 100% 0%,color-mix(in srgb,var(--acc2) 55%,var(--fond)),var(--fond) 60%)}
.steps6{display:flex;gap:4px}.steps6 i{flex:1;height:6px;border-radius:9px;background:#0e232915}.steps6 i.d{background:var(--acc)}
.crew{display:grid;gap:11px;margin-top:14px}
.crew button{position:relative;display:flex;align-items:center;gap:14px;padding:13px 14px;border-radius:22px;background:#fff;text-align:left;color:var(--txt);box-shadow:0 5px 0 #0e232914,var(--sh);transition:transform .15s var(--pop)}
.crew button:active{transform:scale(.97)}
.crew .av{width:62px;height:62px;flex:none;border-radius:20px;display:grid;place-items:center;font-size:34px;background:var(--cc);box-shadow:inset 0 -5px 0 #0002}
.crew strong{display:block;font-size:18px;font-weight:900}
.crew span{font-size:12.5px;color:var(--doux);line-height:1.3;display:block}
.crew em{font-style:normal;display:inline-block;margin-top:5px;font-size:10.5px;font-weight:900;letter-spacing:.04em;padding:3px 8px;border-radius:999px;background:color-mix(in srgb,var(--cc) 22%,#fff);color:color-mix(in srgb,var(--cc) 60%,#000)}
.crew .go{margin-left:auto;font-size:22px;color:var(--doux)}
/* carte de l'aventure */
.mapscr{background:linear-gradient(180deg,var(--nuit),color-mix(in srgb,var(--nuit) 80%,#2a8f98))}
.mapbox{position:relative;flex:1;min-height:0;border-radius:24px;overflow:hidden;background:linear-gradient(180deg,#7fd0d2,#3b9fa8);box-shadow:inset 0 0 0 3px #ffffff30}
.mapbox svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.xpbar{height:10px;border-radius:9px;background:#ffffff22;overflow:hidden}.xpbar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--acc),#ffd45c);transition:width .6s var(--pop)}
.stepcard{display:flex;align-items:center;gap:12px;margin:12px 0 10px;padding:10px 12px;border-radius:18px;background:#ffffff14;border:1.5px solid #ffffff26}
.stepcard .md{width:46px;height:46px;flex:none;border-radius:16px;display:grid;place-items:center;font-size:26px;background:var(--acc);box-shadow:inset 0 -4px 0 #0003}
.stepcard strong{display:block;font-size:16px;font-weight:900}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #ffffff70}50%{box-shadow:0 0 0 10px #ffffff00}}
svg .pl{transform-box:fill-box;transform-origin:center;animation:ring 1.8s ease-out infinite}
@keyframes ring{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.9);opacity:0}}
svg .tok{animation:hop 1.1s ease-in-out infinite}@keyframes hop{50%{transform:translateY(-6px)}}
svg .wv{animation:wv 6s ease-in-out infinite}@keyframes wv{50%{transform:translateX(-14px)}}
svg .sway{transform-box:fill-box;transform-origin:bottom center;animation:sway 4s ease-in-out infinite}@keyframes sway{50%{transform:rotate(4deg)}}
/* station */
.st{background:linear-gradient(180deg,var(--s1,#174650),var(--s2,#0e2329));color:#fff}
.st::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 15% 10%,#ffffff1c 0 60px,#0000 61px),radial-gradient(circle at 90% 30%,#ffffff12 0 90px,#0000 91px);pointer-events:none}
.st>*{position:relative}
.dots{display:flex;gap:5px}.dots i{flex:1;height:7px;border-radius:9px;background:#ffffff26}.dots i.d{background:var(--acc)}.dots i.h{background:linear-gradient(90deg,var(--acc) 50%,#ffffff26 50%)}
.sthd{display:flex;align-items:center;gap:11px;margin-top:11px}
.sthd .md{width:48px;height:48px;flex:none;border-radius:16px;display:grid;place-items:center;font-size:27px;background:#ffffff22;box-shadow:inset 0 -4px 0 #0002}
.gz{position:relative;flex:1;min-height:150px;border-radius:22px;overflow:hidden;margin:10px 0;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:inset 0 0 0 2px #ffffff22}
.medal{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;background:#0009;backdrop-filter:blur(3px);animation:fade .3s}
.medal .big{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;font-size:58px;background:radial-gradient(circle at 35% 30%,var(--acc2),var(--acc));box-shadow:0 0 0 7px #ffffff30,0 12px 30px #0006;animation:popin .6s var(--pop)}
@keyframes popin{from{transform:scale(.2) rotate(-30deg)}}
@keyframes fade{from{opacity:0}}
/* vague */
.wave{background:linear-gradient(180deg,#7fd3d0,#1f6a74)}
.wave .zone{position:absolute;top:0;bottom:0;left:41%;width:18%;background:#ffffff2e;border-left:2px dashed #fffa;border-right:2px dashed #fffa}
.wave .w{position:absolute;top:50%;width:70px;margin:-40px 0 0 -35px;font-size:60px;text-align:center}
.wave .lb{position:absolute;top:10px;left:0;right:0;text-align:center;font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}
/* mots */
.flip{perspective:900px;flex:1;min-height:120px;margin:10px 0}
.flip .in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.r .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;text-align:center;box-shadow:0 6px 0 #0003}
.flip .f{background:#fff;color:var(--nuit)}
.flip .f .w{font-family:var(--titre);font-size:44px;font-style:italic}
.flip .b{background:var(--acc);color:var(--onacc);transform:rotateY(180deg);font-size:16px;line-height:1.4;font-weight:800}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.qo{display:block;width:100%;text-align:center;padding:12px 10px;border-radius:16px;background:#fff;color:var(--nuit);font-size:15px;font-weight:900;box-shadow:0 4px 0 #0003;min-height:52px}
.qo.ok{background:var(--ok);color:#fff}.qo.ko{opacity:.5}
/* paires */
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.match button{padding:10px 6px;border-radius:16px;background:#ffffff1c;border:2px solid #ffffff40;color:#fff;font-size:13.5px;font-weight:800;min-height:52px;transition:transform .15s var(--pop)}
.match button.sel{border-color:var(--acc2);background:#ffffff38;transform:scale(1.04)}
.match button.ok{background:var(--ok);border-color:#fff8;animation:popin .4s var(--pop)}
.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* feu */
.hold{display:grid;place-items:center;background:radial-gradient(circle,#ffffff14,#0000 70%)}
.ring{position:relative;width:min(52vw,200px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center}
.ring svg{position:absolute;inset:0}
.ring .fl{font-size:34px;transition:font-size .08s}
.spark{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--acc2);pointer-events:none;animation:spk 1s ease-out forwards}
@keyframes spk{to{transform:translate(var(--dx),var(--dy));opacity:0}}
/* gratte */
.scratch{background:#fff;color:var(--nuit);display:grid;place-items:center;text-align:center;padding:20px}
.scratch .rv{font-family:var(--titre);font-size:24px;line-height:1.2;font-weight:600}
.scratch canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
/* attrape */
.catch{background:linear-gradient(180deg,#9fdcd8,#2a7d84)}
.catch .it{position:absolute;font-size:40px;line-height:1;padding:8px;transform:translate(-50%,0);will-change:top}
.catch .pop{position:absolute;font-weight:900;font-size:20px;pointer-events:none;animation:pop .7s forwards;color:#fff;text-shadow:0 2px 6px #0006}
@keyframes pop{to{transform:translateY(-40px);opacity:0}}
.bar{height:10px;border-radius:9px;background:#ffffff30;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);transition:width .2s}
/* ================= QUIZ façon jeu de plateau ================= */
.qz{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;padding:12px 14px 14px;color:#fff;overflow:hidden}
.qtop{display:flex;align-items:center;gap:8px}
.qtop .k{color:#fff;opacity:.85;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.streak{display:inline-flex;align-items:center;gap:3px;padding:5px 10px;border-radius:999px;background:#ffffff1c;font-weight:900;font-size:13px;opacity:.55}
.streak.on{background:linear-gradient(135deg,#ff9b3d,#ff5a3d);opacity:1;animation:bump .6s var(--pop)}
.tmr{position:relative;width:46px;height:46px;flex:none}
.tmr svg{width:100%;height:100%;transform:rotate(-90deg)}
.tmr b{position:absolute;inset:0;display:grid;place-items:center;font-size:17px;font-weight:900;font-variant-numeric:tabular-nums}
.tmr.hot b{color:#ffd45c;animation:bump .5s infinite}
.tbar{height:6px;border-radius:9px;background:#ffffff22;margin:9px 0 10px;overflow:hidden}.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ffd45c,var(--acc));transform-origin:left}
.qcard{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:14px;border-radius:24px;background:#fff;color:var(--txt);text-align:center;box-shadow:0 6px 0 #0003;animation:popin .45s var(--pop)}
.qq{font-weight:900;font-size:clamp(17px,5vw,21px);line-height:1.22}
.qemo{font-size:clamp(40px,13vw,58px);line-height:1.1;letter-spacing:.06em;padding:4px 14px;border-radius:20px;background:var(--fond)}
.qimg{max-width:100%;max-height:120px;border-radius:16px;object-fit:cover}
.ind{font-size:12.5px;font-weight:900;color:var(--doux);padding:5px 11px;border-radius:999px;background:#0e23290d}
.ind.on{color:var(--nuit);background:color-mix(in srgb,var(--acc2) 55%,#fff)}
.snd{display:flex;align-items:center;gap:14px}
.play{position:relative;width:78px;height:78px;border-radius:50%;background:var(--chaud);color:var(--onchaud);font-size:30px;display:grid;place-items:center;box-shadow:0 5px 0 color-mix(in srgb,var(--chaud) 58%,#000)}
.play .wv2{position:absolute;inset:0;border-radius:50%;border:3px solid var(--chaud);opacity:0}
.snd.on .play .wv2{animation:ring 1.4s ease-out infinite}.snd.on .play .wv2+.wv2{animation-delay:.7s}
.eq{display:flex;align-items:flex-end;gap:4px;height:40px}
.eq i{width:6px;height:20%;border-radius:4px;background:var(--chaud);opacity:.5}
.snd.on .eq i{opacity:1;animation:eq .8s ease-in-out infinite}.eq i:nth-child(2){animation-delay:-.2s}.eq i:nth-child(3){animation-delay:-.5s}.eq i:nth-child(4){animation-delay:-.1s}.eq i:nth-child(5){animation-delay:-.35s}
@keyframes eq{50%{height:100%}}

   <div class="grow"></div><button class="btn a" id="tq" style="margin-top:10px">▶ Tester le quiz à table</button>`;
  bd.querySelector('#tq').onclick=()=>{Object.assign(V2.st,{q:0,score:0,pts:0,streak:0});V2.save();go('v2','quiz')}}
};

 d.innerHTML=`<div class="pad"><div style="margin-bottom:10px">${logo(34)}</div><div class="k">Version test · imaginée pour ${esc(C.nom)}</div>
  <h1 class="t2" style="margin:6px 0 6px">Un jeu à votre image, à construire ensemble</h1>

  <button class="btn a shine" id="ok">Découvrir la maquette →</button></div>`;
 $('#app').appendChild(d);d.querySelector('#ok').onclick=()=>{LS.set('intro',1);d.remove()};
}

 $('#side').innerHTML=`<div class="k">Version test · ${esc(C.nom)} · ${esc(C.zone)}</div><h1>Un jeu à votre image, à construire ensemble.</h1>

S={tab:'v1',scr:V1.start()};history.pushState({app:1,tab:'v1',scr:S.scr},'');
render();intro();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
