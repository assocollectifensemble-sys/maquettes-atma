<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="robots" content="noindex,nofollow">
<title>Le Moana · le jeu (version test)</title>
<meta name="theme-color" content="#10303f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Le Moana">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;800&family=Pacifico:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{--nuit:#0e2329;--acc:#caaa6d;--acc2:#e7cf98;--fond:#f5eee2;--chaud:#e3743c;--ok:#2f8f6b;--txt:#1d2b2f;--doux:#66777a;--titre:'Cormorant Garamond',Georgia,serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{font-family:Raleway,system-ui,sans-serif;background:#0b1518;color:var(--txt);display:flex;justify-content:center;align-items:center;gap:48px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
#app{position:relative;width:100%;max-width:460px;height:100vh;height:100dvh;display:grid;grid-template-rows:auto 1fr auto;background:var(--fond);overflow:hidden}
/* ---- en-tête ---- */
.hd{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:var(--nuit);color:#fff;min-height:50px}
.hd .lg{height:26px;max-width:110px;object-fit:contain}
.hd .nm{font-family:var(--titre);font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.hd .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.04em;white-space:nowrap}
.pill.test{background:#ffffff1c;color:var(--acc2)}
.pill.inst{background:var(--acc);color:var(--nuit)}
/* ---- barre du bas ---- */
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);background:#fff;box-shadow:0 -6px 20px #0e232912;position:relative;z-index:5}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;border-radius:14px;font-size:10.5px;font-weight:700;color:var(--doux);line-height:1.1}
.nav button .ic{font-size:21px;line-height:1;filter:grayscale(.5);opacity:.75;transition:.2s}
.nav button .n{position:absolute;top:3px;left:calc(50% - 22px);width:16px;height:16px;border-radius:50%;background:var(--doux);color:#fff;font-size:9.5px;display:grid;place-items:center}
.nav button.on{background:var(--nuit);color:#fff}
.nav button.on .ic{filter:none;opacity:1;transform:scale(1.12)}
.nav button.on .n{background:var(--acc);color:var(--nuit)}
.nav button.next::after{content:"à voir";position:absolute;top:-9px;right:2px;background:var(--chaud);color:#fff;font-size:9px;padding:2px 6px;border-radius:999px;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
/* ---- écrans ---- */
main{position:relative;overflow:hidden}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateX(18px)}}
.scr.back{animation:inb .3s ease}@keyframes inb{from{opacity:0;transform:translateX(-18px)}}
.dark{background:var(--nuit);color:#fff}
.pad{padding:16px 18px}
.grow{flex:1}
.k{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--acc)}
.t1{font-family:var(--titre);font-weight:600;font-size:clamp(30px,8.6vw,40px);line-height:1.02}
.t1 i{color:var(--acc2);font-style:italic}
.t2{font-family:var(--titre);font-weight:600;font-size:clamp(25px,7vw,31px);line-height:1.08}
.t3{font-weight:800;font-size:16px;line-height:1.3}
.p{font-size:14.5px;line-height:1.48}
.m{font-size:12.5px;line-height:1.42;color:var(--doux)}
.dark .m{color:#ffffffa8}
.btn{display:block;width:100%;padding:15px 14px;border-radius:999px;background:var(--nuit);color:#fff;font-weight:800;letter-spacing:.05em;text-transform:uppercase;font-size:13px;text-align:center;text-decoration:none;transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.a{background:var(--acc);color:var(--nuit)}
.btn.c{background:var(--chaud);color:#fff}
.btn.g{background:transparent;border:1.5px solid currentColor;color:inherit}
.btn.s{padding:10px;font-size:11px}
.btn+.btn{margin-top:9px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;background:#ffffff1f;font-size:12px;font-weight:600}
.row{display:flex;gap:8px;align-items:center}
.wrap{flex-wrap:wrap}
.card{background:#fff;border-radius:18px;padding:15px;box-shadow:0 6px 22px #0e232912}
.toast{position:absolute;left:50%;bottom:86px;transform:translate(-50%,30px);opacity:0;background:var(--nuit);color:#fff;padding:11px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:60;transition:.3s;width:max-content;max-width:90%;text-align:center;pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1}
.nextbar{display:flex;align-items:center;gap:10px;margin-top:12px;padding:11px 14px;border-radius:16px;background:var(--chaud);color:#fff;font-weight:700;font-size:13.5px;text-align:left;width:100%}
.nextbar b{font-size:20px}.nextbar span{flex:1}
/* ---- accueil ---- */
.hero{position:relative;flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding:18px;color:#fff;background:var(--nuit) center/cover}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#00000010 0%,#0000 25%,var(--nuit) 78%)}
.hero>*{position:relative}
.lang{display:flex;background:#0005;border-radius:999px;padding:3px;margin-left:auto}
.lang button{padding:5px 10px;font-size:11px;font-weight:800;border-radius:999px;color:#fffc}
.lang button.on{background:#fff;color:var(--nuit)}
.from{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:#ffffff17;border:1px solid #ffffff30;text-align:left;width:100%;color:#fff}
.from b{font-size:22px}.from div{flex:1;font-size:12.5px;line-height:1.3}.from strong{display:block;font-size:14px}
.bonbanner{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--acc);color:var(--nuit);font-weight:800;font-size:14px;width:100%;text-align:left}
/* qui joue */
.crew{display:grid;gap:10px;margin-top:14px}
.crew button{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;background:#ffffff12;border:1.5px solid #ffffff30;text-align:left;color:#fff}
.crew button b{font-size:34px}
.crew button strong{display:block;font-size:17px}
.crew button span{font-size:12.5px;opacity:.75}
.crew button:active{background:#fff;color:var(--nuit)}
/* carte */
.els{display:flex;justify-content:space-between;gap:4px;margin:10px 0}
.el{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.45;text-align:center}
.el b{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--acc);display:grid;place-items:center;font-size:21px}
.el.d{opacity:1}.el.d b{background:var(--acc);color:var(--nuit)}
.el.n{opacity:1}.el.n b{animation:pulse 1.6s infinite;background:#ffffff18}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #ffffff60}50%{box-shadow:0 0 0 9px #ffffff00}}
svg.map{width:100%;display:block;border-radius:16px;max-height:30vh}
/* station */
.st{background:linear-gradient(180deg,var(--s1,#174650),var(--s2,#0e2329));color:#fff}
.dots{display:flex;gap:5px}.dots i{flex:1;height:4px;border-radius:9px;background:#ffffff30}.dots i.d{background:var(--acc)}
.qo{display:block;width:100%;text-align:left;padding:13px 15px;border-radius:14px;background:#ffffff14;border:1.5px solid #ffffff2e;margin:7px 0;font-size:15px;color:#fff}
.qo.ok{background:var(--ok);border-color:var(--ok)}.qo.ko{opacity:.45}
.fact{background:#0000002e;border-left:3px solid var(--acc);padding:11px 13px;border-radius:10px;font-size:13.5px;line-height:1.45;margin:10px 0}
.gz{position:relative;flex:1;min-height:180px;border-radius:18px;overflow:hidden;margin:12px 0;touch-action:none;user-select:none;-webkit-user-select:none}
/* vague */
.wave{background:linear-gradient(180deg,#6cc0bd,#1f5f68)}
.wave .zone{position:absolute;top:0;bottom:0;left:41%;width:18%;background:#ffffff26;border-left:2px dashed #fff9;border-right:2px dashed #fff9}
.wave .w{position:absolute;top:50%;width:70px;margin:-40px 0 0 -35px;font-size:60px;text-align:center}
.wave .lb{position:absolute;top:10px;left:0;right:0;text-align:center;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}
/* mots */
.flip{perspective:900px;flex:1;min-height:150px;margin:12px 0}
.flip .in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.r .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center}
.flip .f{background:var(--fond);color:var(--nuit)}
.flip .f .w{font-family:var(--titre);font-size:46px;font-style:italic}
.flip .b{background:var(--acc);color:var(--nuit);transform:rotateY(180deg);font-size:16px;line-height:1.4;font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two .qo{text-align:center;margin:0}
/* paires */
.match{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}
.match button{padding:12px 6px;border-radius:14px;background:#ffffff14;border:1.5px solid #ffffff35;color:#fff;font-size:13.5px;font-weight:700;min-height:58px}
.match button.sel{border-color:var(--acc2);background:#ffffff30;transform:scale(1.03)}
.match button.ok{background:var(--ok);border-color:var(--ok)}
.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* feu */
.hold{display:grid;place-items:center}
.ring{position:relative;width:min(58vw,230px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center}
.ring svg{position:absolute;inset:0}
.ring .fl{font-size:34px;transition:font-size .08s}
.spark{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--acc2);pointer-events:none;animation:spk 1s ease-out forwards}
@keyframes spk{to{transform:translate(var(--dx),var(--dy));opacity:0}}
/* gratte */
.scratch{background:var(--fond);color:var(--nuit);display:grid;place-items:center;text-align:center;padding:20px}
.scratch .rv{font-family:var(--titre);font-size:24px;line-height:1.2;font-weight:600}
.scratch canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
/* attrape */
.catch{background:linear-gradient(180deg,#8fd3d0,#2a7d84)}
.catch .it{position:absolute;font-size:40px;line-height:1;padding:8px;transform:translate(-50%,0);will-change:top}
.catch .pop{position:absolute;font-weight:800;font-size:20px;pointer-events:none;animation:pop .7s forwards;color:#fff;text-shadow:0 2px 6px #0006}
@keyframes pop{to{transform:translateY(-40px);opacity:0}}
.bar{height:8px;border-radius:9px;background:#ffffff30;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);transition:width .2s}
/* bon */
.ticket{position:relative;border-radius:22px;background:var(--fond);color:var(--nuit);overflow:hidden;margin:12px 0 0}
.ticket .band{height:9px;background:var(--day)}
.ticket .tb{padding:15px 16px 12px}
.ticket .pr{font-family:var(--titre);font-weight:600;font-size:clamp(25px,7vw,30px);line-height:1.04;margin:6px 0 3px}
.ticket .cd{font-family:ui-monospace,monospace;font-weight:800;font-size:19px;letter-spacing:.12em}
.ticket .lv{display:flex;align-items:center;gap:7px;font-weight:800;font-variant-numeric:tabular-nums;font-size:15px}
.ticket .flm{font-size:26px;display:inline-block;animation:dance 1.2s ease-in-out infinite}
@keyframes dance{0%,100%{transform:rotate(-7deg) scale(1)}50%{transform:rotate(7deg) scale(1.17)}}
.ticket .perf{border-top:2px dashed #0e232930;margin:0 14px}
.ticket .stf{padding:11px 14px;background:#fff}
.holdb{position:relative;overflow:hidden;width:100%;padding:13px;border-radius:12px;background:var(--nuit);color:#fff;font-weight:800;font-size:12px;letter-spacing:.05em;text-transform:uppercase;touch-action:none;user-select:none;-webkit-user-select:none}
.holdb i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--ok)}.holdb span{position:relative}
.used .flm{animation:none;filter:grayscale(1)}
.stamp{position:absolute;top:48px;right:12px;transform:rotate(-12deg);border:3px solid var(--ok);color:var(--ok);font-weight:800;padding:5px 9px;border-radius:10px;font-size:13px;background:#fffe}
.mini3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
.mini3>*{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;border-radius:14px;background:#ffffff14;font-size:11px;font-weight:700;color:#fff;text-decoration:none;text-align:center;line-height:1.2}
.mini3 b{font-size:20px}
/* à table */
.th{position:relative;min-height:118px;display:flex;align-items:flex-end;padding:14px 16px;color:#fff;background:var(--nuit) center/cover}
.th::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000,var(--nuit) 92%)}
.th>*{position:relative}
.gc{margin:12px 14px 4px;border-radius:18px;padding:15px;background:linear-gradient(135deg,var(--nuit),color-mix(in srgb,var(--nuit) 70%,var(--acc)));color:#fff}
.dish{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #0e232912}
.dish b{font-size:14.5px}.dish p{font-size:12.5px;color:var(--doux);margin-top:2px;line-height:1.35}
.dish em{font-style:normal;font-weight:800;white-space:nowrap}
.faces{display:flex;justify-content:space-between;margin:14px 0}
.faces button{font-size:38px;filter:grayscale(1);opacity:.5;transition:.2s}
.faces button.on{filter:none;opacity:1;transform:scale(1.15)}
input[type=email],input[type=text],input[type=number],textarea,select{width:100%;font-size:15px;padding:11px 13px;border-radius:12px;border:1.5px solid #0e23291f;background:#fff;margin:7px 0}
label.ck{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;line-height:1.4;color:#33454a;margin:6px 0}
label.ck input{margin-top:2px;width:18px;height:18px;flex:none}
.prog{height:5px;border-radius:9px;background:#ffffff25;margin:10px 0;overflow:hidden}.prog i{display:block;height:100%;background:var(--acc)}
/* défi */
.dfh{padding:12px 16px 8px;color:#fff;background:linear-gradient(135deg,var(--chaud),var(--nuit))}
.cvw{position:relative;flex:1;min-height:200px;margin:0 12px;border-radius:18px;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.cvw canvas{position:absolute;inset:0;width:100%;height:100%}
.hud{display:flex;justify-content:space-between;font-weight:800;padding:8px 16px;font-variant-numeric:tabular-nums;font-size:14px}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#0e2329b8;color:#fff;text-align:center;padding:20px}
.ov .big{font-family:var(--titre);font-size:52px;font-weight:600;line-height:1}
.eth{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;padding:8px 12px 0}
.eth span{font-size:10.5px;padding:4px 9px;border-radius:999px;background:#0e232912;color:var(--nuit);font-weight:700}
.lb{list-style:none}
.lb li{display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid #0e232912;font-size:14.5px}
.lb .rk{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--fond);font-weight:800;font-size:13px}
.lb li:nth-child(1) .rk{background:var(--acc)}.lb li:nth-child(2) .rk{background:#cfd6d8}.lb li:nth-child(3) .rk{background:#d9a77a}
.lb li.me{background:color-mix(in srgb,var(--acc) 25%,transparent);border-radius:10px}
.lb em{margin-left:auto;font-style:normal;font-weight:800}
/* côté resto */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;margin:0 14px;border-radius:14px;background:#0e232910}
.seg button{padding:9px 4px;border-radius:11px;font-size:12px;font-weight:800;color:var(--doux)}
.seg button.on{background:#fff;color:var(--nuit);box-shadow:0 2px 8px #0e232918}
.tg{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #0e232912}
.tg b{display:block;font-size:14px}.tg span{font-size:12px;color:var(--doux);line-height:1.35;display:block;margin-top:2px}
.sw{position:relative;width:48px;height:28px;flex:none;border-radius:999px;background:#c9cfd0;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--ok)}.sw.on::after{left:23px}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kp div{background:#fff;border-radius:14px;padding:11px}
.kp b{display:block;font-size:22px;color:var(--nuit)}.kp span{font-size:11.5px;color:var(--doux);line-height:1.3;display:block}
.fict{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:#fff2d6;color:#8a6a2c;padding:3px 7px;border-radius:6px;display:inline-block;vertical-align:middle}
.steps{counter-reset:s;list-style:none}
.steps li{position:relative;padding:0 0 14px 40px;font-size:13.5px;line-height:1.45}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:-2px;width:28px;height:28px;border-radius:50%;background:var(--acc);color:var(--nuit);font-weight:800;display:grid;place-items:center}
.steps b{display:block;font-size:14.5px}
.pk{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #0e232912;font-size:13.5px}
.pk b{font-size:22px}
/* accueil démo (surcouche) */
.intro{position:absolute;inset:0;z-index:40;background:var(--nuit) center/cover;color:#fff;display:flex;flex-direction:column;justify-content:flex-end}
.intro::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0003,var(--nuit) 55%)}
.intro>*{position:relative}
.intro ol{list-style:none;margin:12px 0 16px;display:grid;gap:8px}
.intro li{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;background:#ffffff14;font-size:13.5px;line-height:1.3}
.intro li b{font-size:24px}.intro li strong{display:block;font-size:14.5px}
.sheet{position:absolute;inset:0;z-index:50;background:#0008;display:flex;align-items:flex-end}
.sheet>div{background:#fff;border-radius:22px 22px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 18px);width:100%;animation:up .3s ease}
@keyframes up{from{transform:translateY(100%)}}
/* grand écran */
.side{display:none;max-width:400px;color:#ddd5c6}
.side h1{font-family:var(--titre);font-weight:600;font-size:42px;line-height:1.05;color:#fff;margin:10px 0 14px}
.side p{font-size:15px;line-height:1.6;margin:12px 0}
.side b{color:var(--acc2)}
.side .qr{background:#fff;padding:12px;border-radius:16px;display:inline-block;margin-top:10px}
@media(min-width:980px){.side{display:block}#app{height:min(860px,calc(100vh - 40px));border-radius:34px;box-shadow:0 30px 80px #0009,0 0 0 10px #1c2a2e}}
@media(max-height:700px){.ticket .tb{padding:11px 14px 9px}.mini3>*{padding:7px 4px}.mini3{margin-top:7px}.qo{padding:10px 13px;margin:5px 0}.fact{margin:7px 0;padding:8px 11px}.nextbar{margin-top:8px;padding:9px 12px}.pad{padding:12px 16px}}
@media(max-height:640px){.t1{font-size:28px}.crew button{padding:11px}.el b{width:40px;height:40px}}
</style>
</head>
<body>
<aside class="side" id="side"></aside>
<div id="app">
 <header class="hd" id="hd"></header>
 <main id="main"></main>
 <nav class="nav" id="nav"></nav>
 <div class="toast" id="toast"></div>

<script>

 st:Object.assign({day:'',tries:3,best:0,last:null},LS.get('v3',{})),

  const gr=c.createLinearGradient(0,0,0,H);gr.addColorStop(0,sky[0]);gr.addColorStop(.5,sky[1]);gr.addColorStop(.501,sea[0]);gr.addColorStop(1,sea[1]);c.fillStyle=gr;c.fillRect(0,0,W,H);
  c.fillStyle='#ffe2a0';c.beginPath();c.arc(W*.78,H*.44,H*.09,0,7);c.fill();

   obs.forEach(o=>o.x-=spd*dt);bon.forEach(b=>b.x-=spd*dt);

   c.textAlign='center';c.textBaseline='alphabetic';

   obs=obs.filter(o=>{const oh=sz*.75*o.h;if(!o.hit&&Math.abs(o.x-px)<sz*.42&&y>G-oh*.85){o.hit=1;hurt=40;score=Math.max(0,score-3);$('#sc').textContent=score;buzz(50)}

   if(hurt>0)hurt-=dt;
   if(!(hurt>0&&Math.floor(hurt/4)%2)){c.save();c.translate(px,y);c.rotate(Math.max(-.4,Math.min(.4,vy*.02)));c.font=`${sz}px serif`;c.fillText(D.joueur,0,0);c.restore()}

   requestAnimationFrame(step)};requestAnimationFrame(step)},
