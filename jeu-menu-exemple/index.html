<style>

.scr{animation:in .28s ease}

.pad{padding:16px}
.t1{font:600 30px/1.1 var(--titre);color:var(--nuit)}

.filt{display:flex;gap:8px;flex-wrap:wrap;padding:10px 16px 0}

.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:6px;width:28px;height:28px;border-radius:50%;background:var(--acc);color:var(--nuit);font-weight:800;display:flex;align-items:center;justify-content:center}
.toast{position:absolute;left:50%;bottom:86px;transform:translate(-50%,20px);background:var(--nuit);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center}

.intro{position:absolute;inset:0;z-index:20;background:var(--nuit);color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:28px 22px calc(26px + env(safe-area-inset-bottom));overflow:hidden}

 el.innerHTML=`<div class="hero"><div class="deco">${esc(M.emoji||'🍛')}</div><div class="k" style="color:var(--acc2)">${esc(M.surtitre||'La carte')}</div><div class="t1" style="margin-top:4px">${M.titre_html||'Bon appétit !'}</div><p>${esc(M.accroche||'')}</p></div>
 <div class="cats" id="cats">${M.categories.map((c,i)=>`<button data-c="${i}" class="${i?'':'on'}">${esc(c.emoji||'')} ${esc(c.nom)}</button>`).join('')}</div>
 <div class="filt">${flt.map(([k,l])=>`<button data-f="${k}" class="${F.includes(k)?'on':''}">${esc(l)}</button>`).join('')}</div>
 ${M.categories.map((c,i)=>`<div class="cat" id="cat${i}"><h2>${esc(c.emoji||'')} ${esc(c.nom)}</h2>${c.info?`<div class="ci">${esc(c.info)}</div>`:''}
  ${c.plats.map(p=>`<div class="pl ${okP(p)?'':'dim'}">${p.photo||p.emoji?`<div class="ph" style="${p.photo?`background-image:url(${p.photo})`:''}">${p.photo?'':esc(p.emoji)}</div>`:''}
   <div class="bd"><div class="row"><b>${esc(p.nom)}</b><span class="px">${prix(p.prix)}</span></div>${p.desc?`<div class="ds">${esc(p.desc)}</div>`:''}
   ${(p.tags||[]).length||(p.allergenes||[]).length?`<div class="tags">${(p.tags||[]).map(t=>`<span class="tag ${t==='vege'?'v':t==='pimente'?'s':''}">${esc((M.tags_libelles||{})[t]||({vege:'🌱 Végétarien',pimente:'🌶️ Pimenté',maison:'Fait maison',peï:'Produit péi',nouveau:'Nouveau'})[t]||t)}</span>`).join('')}${(p.allergenes||[]).map(a=>`<span class="tag al">${esc(ALL[a]||a)}</span>`).join('')}</div>`:''}</div></div>`).join('')}</div>`).join('')}
 <div class="note">${esc(M.note||'Allergènes : demandez à l\'équipe, elle vous renseigne avec plaisir.')}</div>
 <div class="cta"><button class="btn a" data-go="jeu">🎲 ${esc(M.jeu.cta||'En attendant votre plat : 3 questions, un cadeau')}</button></div>`;
 const cats=el.querySelector('#cats');
 cats.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{cats.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));el.querySelector('#cat'+b.dataset.c).scrollIntoView({behavior:'smooth',block:'start'})});
 el.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{const k=b.dataset.f,i=F.indexOf(k);i<0?F.push(k):F.splice(i,1);LS.set('filtre',F);const y=$('#main').scrollTop;render();$('#main').scrollTop=y});
 const main=$('#main');main.onscroll=()=>{if(S!=='carte')return;let cur=0;M.categories.forEach((c,i)=>{const h=el.querySelector('#cat'+i);if(h&&h.getBoundingClientRect().top<160)cur=i});
  cats.querySelectorAll('button').forEach((x,i)=>{const on=i===cur;if(on&&!x.classList.contains('on'))x.scrollIntoView({inline:'center',block:'nearest'});x.classList.toggle('on',on)})};
 bind(el)},

/* ---------- 2. le jeu ---------- */
jeu(el){const J=M.jeu,b=bon();
 if(b&&!b.used){el.innerHTML=`<div class="pad"><div class="k">Le jeu</div><div class="t1" style="margin-top:4px">Votre cadeau vous attend 🎉</div><p class="m" style="margin-top:8px">Vous avez déjà joué aujourd'hui : votre bon est prêt, montrez-le au moment de l'addition.</p>${nextBtn('bon','🎁 Voir mon bon')}<button class="btn l" id="rj">Rejouer pour le plaisir</button></div>`;
  el.querySelector('#rj').onclick=()=>quiz(el,true);bind(el);return}
 el.innerHTML=`<div class="pad"><div class="k">${esc(J.surtitre||'Le jeu de la maison')}</div><div class="t1" style="margin-top:4px">${J.titre_html||'3 questions, 1 cadeau'}</div>
  <p class="m" style="margin-top:8px">${esc(J.accroche||'')}</p>
  <div class="card"><ol class="steps"><li>Répondez à ${J.questions.length} petites questions sur la carte et l'île.</li><li>Grattez la carte : votre cadeau apparaît.</li><li>Montrez le bon à l'équipe : il est valable ${J.validite_jours||30} jours.</li></ol></div>
  <button class="btn a" id="st">C'est parti !</button></div>`;
 el.querySelector('#st').onclick=()=>quiz(el,false)},
/* ---------- 3. le bon ---------- */
bon(el){const b=bon();
 if(!b){el.innerHTML=`<div class="pad"><div class="k">Mon bon</div><div class="t1" style="margin-top:4px">Votre bon s'affichera ici</div><p class="m" style="margin-top:8px">Jouez au petit jeu de la maison : 3 questions, puis une carte à gratter.</p>${nextBtn('jeu','🎲 Jouer maintenant')}</div>`;bind(el);return}
 const d=new Date(b.exp),ds=pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();
 el.innerHTML=`<div class="pad"><div class="k">Mon bon</div><div class="ticket"><div class="tt"><div class="k" style="color:var(--acc2)">${esc(C.nom)}</div><div class="t2" style="margin-top:4px">${esc(b.lot)}</div></div>
  <div class="tb"><div class="m">Code à montrer à l'équipe</div><div class="code">${b.code}</div>
  <div class="mini3"><div><b>${ds}</b>valable jusqu'au</div><div><b>1 par table</b>par visite</div><div><b>${b.used?'Utilisé ✓':'Prêt'}</b>statut</div></div>
  ${b.used?`<p class="m" style="margin-top:12px">Utilisé le ${new Date(b.used).toLocaleDateString('fr-FR')}. Merci et à très vite !</p>`:`<button class="btn" id="use">L'équipe valide le bon</button><p class="m" style="margin-top:8px;font-size:12.5px">Ce bouton est réservé à l'équipe, au moment de l'addition.</p>`}</div></div>
  ${M.jeu.conditions?`<p class="m" style="margin-top:12px;font-size:12.5px">${esc(M.jeu.conditions)}</p>`:''}
  ${nextBtn('resto','👋 Découvrir le côté resto')}</div>`;
 const u=el.querySelector('#use');u&&(u.onclick=()=>{b.used=Date.now();LS.set('bon',b);buzz(40);toast('Bon validé ✓ Bonne fin de repas !');render()});bind(el)},
/* ---------- 4. côté resto ---------- */
resto(el){const R=C.cote_resto||{};
 el.innerHTML=`<div class="pad"><div class="k">Côté resto</div><div class="t1" style="margin-top:4px">${R.titre_html||'Votre carte en ligne, <i>à votre image</i>'}</div>
  <p class="m" style="margin-top:8px">${esc(R.accroche||'')}</p>
  <div class="card"><b style="color:var(--nuit)">Comment ça marche</b><ol class="steps">${(R.etapes||[]).map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div>
  <div class="t2" style="margin-top:22px">3 propositions</div>
  ${(R.propositions||[]).map((p,i)=>`<div class="prop ${i?'':'on'}"><span class="n">${i+1}</span><div><b>${esc(p.titre)}</b><p>${esc(p.texte)}</p>${p.lien?`<a href="${p.lien}" target="_blank" rel="noopener" style="display:inline-block;margin-top:6px;font-weight:800;color:var(--chaud);font-size:14px">${esc(p.lien_txt||'Voir un exemple')} →</a>`:''}</div></div>`).join('')}
  <div class="card" style="background:var(--nuit);color:#fff"><b style="color:var(--acc2)">Une maquette volontairement simple</b><p style="font-size:14px;opacity:.9;margin-top:4px">${esc(R.simple||'')}</p></div>
  <button class="btn l" id="rz">Revoir la maquette depuis le début</button>
  <p class="m" style="text-align:center;margin:16px 0 6px;font-size:12.5px">${esc(C.marque||'Atma Digital · Aurélie & Jonathan · La Réunion')}</p></div>`;
 el.querySelector('#rz').onclick=()=>{['bon','seen','filtre','intro'].forEach(k=>localStorage.removeItem(KEY+k));location.hash='';location.reload()}}
};

/* ---------- quiz + grattage ---------- */
function quiz(el,replay){const Q=M.jeu.questions;let i=0,score=0;
 const step=()=>{const q=Q[i],opts=shuffle(q[1].map((t,k)=>[t,k===0]));
  el.innerHTML=`<div class="pad"><div class="prog">${Q.map((_,k)=>`<i class="${k<i?'ok':k===i?'on':''}"></i>`).join('')}</div><div class="k" style="margin-top:12px">Question ${i+1} sur ${Q.length}</div>
   <div class="t2" style="margin-top:6px">${esc(q[0])}</div><div id="opts">${opts.map(([t,g])=>`<button class="qo" data-g="${g?1:0}">${esc(t)}</button>`).join('')}</div><div id="fx"></div></div>`;
  el.querySelectorAll('.qo').forEach(b=>b.onclick=()=>{if(el.querySelector('.qo.good'))return;const g=b.dataset.g==='1';if(g)score++;buzz(g?30:[20,40,20]);
   el.querySelectorAll('.qo').forEach(x=>{if(x.dataset.g==='1')x.classList.add('good');else if(x===b)x.classList.add('bad')});
   el.querySelector('#fx').innerHTML=`<div class="fact">${g?'Bravo ! ':'Presque ! '}${esc(q[2]||'')}</div><button class="btn a" id="nx">${i+1<Q.length?'Question suivante':'Gratter ma carte'}</button>`;
   el.querySelector('#nx').onclick=()=>{i++;i<Q.length?step():gratte(el,score,replay)}})};
 step()}
function gratte(el,score,replay){const lots=M.jeu.lots,lot=lots[Math.min(lots.length-1,Math.max(0,lots.length-1-(Q=>Q.length-score)(M.jeu.questions)))];
 el.innerHTML=`<div class="pad" style="text-align:center"><div class="k">${score} bonne${score>1?'s':''} réponse${score>1?'s':''} sur ${M.jeu.questions.length}</div><div class="t2" style="margin-top:6px">Grattez la carte avec le doigt</div>
  <div class="scratch"><div class="under"><div class="m">Votre cadeau</div><div class="big">${esc(lot)}</div></div><canvas id="cv"></canvas></div><p class="m" id="hint">Encore un peu…</p><div id="after"></div></div>`;
 const cv=el.querySelector('#cv'),box=cv.getBoundingClientRect(),dpr=devicePixelRatio||1;cv.width=box.width*dpr;cv.height=box.height*dpr;const x=cv.getContext('2d');x.scale(dpr,dpr);
 const g=x.createLinearGradient(0,0,box.width,box.height);g.addColorStop(0,getComputedStyle(document.documentElement).getPropertyValue('--acc'));g.addColorStop(1,getComputedStyle(document.documentElement).getPropertyValue('--chaud'));
 x.fillStyle=g;x.fillRect(0,0,box.width,box.height);x.fillStyle='#fff';x.font='800 20px Nunito,sans-serif';x.textAlign='center';x.fillText(M.jeu.gratte||'Grattez ici ✨',box.width/2,box.height/2+7);
 x.globalCompositeOperation='destination-out';let down=false,done=false;
 const pt=e=>{const r=cv.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return[t.clientX-r.left,t.clientY-r.top]};
 const dig=e=>{if(!down||done)return;e.preventDefault();const[a,b]=pt(e);x.beginPath();x.arc(a,b,22,0,7);x.fill();check()};
 let n=0;const check=()=>{if(++n%8)return;const d=x.getImageData(0,0,cv.width,cv.height).data;let c=0;for(let k=3;k<d.length;k+=64)if(d[k]===0)c++;if(c/(d.length/64)>.45)finish()};
 const finish=()=>{if(done)return;done=true;cv.style.transition='opacity .5s';cv.style.opacity=0;buzz([30,60,30]);
  if(!replay||!bon()||bon().used)makeBon(lot);
  el.querySelector('#hint').textContent='Bien joué 🎉';el.querySelector('#after').innerHTML=nextBtn('bon','🎁 Voir mon bon');bind(el);render2()};
 const render2=()=>{const h=$('#hd');if(h&&!$('#pb'))h.insertAdjacentHTML('beforeend','<button class="pill" id="pb">🎁 Mon bon</button>');const pb=$('#pb');pb&&(pb.onclick=()=>go('bon'))};
 cv.addEventListener('pointerdown',e=>{down=true;cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);dig(e)});cv.addEventListener('pointermove',dig);addEventListener('pointerup',()=>down=false);
 setTimeout(()=>{if(!done)el.querySelector('#hint').innerHTML='Astuce : <button style="text-decoration:underline;font-weight:800;color:var(--chaud)" id="sk">tout révéler</button>';const s=el.querySelector('#sk');s&&(s.onclick=finish)},7000)}

/* ---------- intro + côté écran large ---------- */
function intro(){if(LS.get('intro',0))return;const I=C.intro||{};const d=document.createElement('div');d.className='intro';
 d.innerHTML=`<div class="deco">${esc(M.emoji||'🍛')}</div><span class="badge">${esc(I.badge||'Maquette de démonstration')}</span><div class="t1">${I.titre_html||esc(C.nom)}</div><p>${esc(I.texte||'')}</p>
 <ol><li><b>📖</b><div><strong>La carte</strong> · catégories, prix, photos, allergènes</div></li><li><b>🎲</b><div><strong>Le jeu</strong> · 3 questions et une carte à gratter</div></li><li><b>🎁</b><div><strong>Le bon</strong> · un cadeau à montrer à l'équipe</div></li></ol>
 <button class="btn a" id="ok">Découvrir la carte</button>`;$('#app').appendChild(d);d.querySelector('#ok').onclick=()=>{LS.set('intro',1);d.remove()}}
$('#side').innerHTML=`<div class="k" style="color:var(--acc2)">Maquette · Atma Digital</div><div class="t1" style="margin-top:8px">${esc(C.nom)}</div><p>${esc((C.cote_resto||{}).ecran_large||'Sur téléphone, le client scanne le QR posé sur la table : la carte s\'ouvre, puis un petit jeu lui offre un cadeau.')}</p><p>Ouvrez cette page sur votre téléphone pour la vivre <b>comme vos clients</b>.</p>`;
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
render();intro();
</script>
